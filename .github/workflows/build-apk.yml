name: Build RKS JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          SDK_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Check sdkmanager
        run: |
          "$SDKMANAGER" --version

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install required Android SDK
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKS-JARVIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
